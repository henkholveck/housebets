<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1a21">
<title>Housebets Sportsbook · Prototype</title>
<meta name="description" content="Housebets Sportsbook clickable prototype. Sample data only, no real money.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b1a21'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Arial Black,Arial' font-weight='900' font-size='38' fill='%2300f5ff'%3EH%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{height:100%;}
*{-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid #c3f4f1;outline-offset:2px}
input::placeholder{color:#7d8b96}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#233036;border-radius:8px}::-webkit-scrollbar-track{background:transparent}

body{margin:0;background:#07141a}
@keyframes hbTicker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes hbPing{0%{transform:scale(1);opacity:.7}80%,100%{transform:scale(2.6);opacity:0}}
@keyframes hbRoll{from{transform:translateY(70%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes hbIn{from{transform:translateY(10px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes hbSheet{from{transform:translateY(40px);opacity:.4}to{transform:translateY(0);opacity:1}}
@keyframes hbSpin{to{transform:rotate(360deg)}}
@keyframes hbPop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}

.hb-card{border-radius:10px!important}
.hb-lift{position:relative;transition:border-color .18s,background-color .18s}
.hb-lift:hover{border-color:#2b4652!important}
.hb-nav{position:relative;transition:background-color .15s,color .15s}
.hb-nav::after,.hb-lift::after{content:'';position:absolute;inset:0;border-radius:inherit;background:rgba(255,255,255,0);transition:background .15s;pointer-events:none}
.hb-nav:hover::after,.hb-lift:hover::after{background:rgba(255,255,255,.035)}
.hb-odd{transition:background .15s,border-color .3s,color .15s!important}
.hb-odd:not(:disabled):hover{background:#22363f!important}
.hb-odd[aria-pressed="true"]:hover{background:#d4f8f5!important}
.hb-odd:not(:disabled):active{transform:scale(.985)}
.hb-sport .hb-well{transition:background .15s, transform .15s}
.hb-sport:hover .hb-well{background-color:#1a3340!important;transform:translateY(-1px)}
.hb-sport:active .hb-well{transform:scale(.96)}
.hb-tile{transition:border-color .18s,background-color .18s}
.hb-tile:hover{border-color:#2b4652!important;background-color:#11252f!important}
.hb-cta{transition:filter .15s,transform .1s}
.hb-cta:not(:disabled):hover{filter:brightness(1.05)}
.hb-cta:not(:disabled):active{transform:scale(.99)}
.hb-gloss{background-image:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 60%)!important}
.hb-gloss:disabled{background-image:none!important}
.hb-chip{transition:border-color .15s}
.hb-chip:hover{border-color:#3b5966!important}

#proto{position:fixed;z-index:999;left:252px;bottom:14px;font-family:'JetBrains Mono',monospace}
#proto>button{display:flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:18px;border:1px solid #2b6a6f;background:#0d1f29;color:#c3f4f1;font:700 11px 'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#proto .menu{display:none;position:absolute;left:0;bottom:44px;width:260px;padding:8px;border-radius:12px;background:#0d1f29;border:1px solid #233036;box-shadow:0 20px 50px rgba(0,0,0,.6)}
#proto.open .menu{display:block}
#proto .menu span{display:block;padding:8px 10px 6px;color:#8a96a4;font-size:10px;letter-spacing:.14em;text-transform:uppercase}
#proto .menu a{display:block;padding:10px;border-radius:8px;color:#f2fbff;font:600 13px Inter,sans-serif;text-decoration:none}
#proto .menu a:hover{background:#13394c}
@media (max-width:759px){#proto{left:auto;right:8px;bottom:auto;top:65px}#proto>button{height:30px;padding:0 10px;font-size:10px;opacity:.92}#proto .menu{left:auto;right:0;bottom:auto;top:38px}}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="{{rootStyle}}">
<header style="{{topStyle}}">
<sc-if value="{{isDesktop}}" hint-placeholder-val="{{true}}">
<button class="hb-card hb-lift" onClick="{{toggleNav}}" aria-label="Toggle side menu" style="width:40px; height:40px; flex:none; display:flex; align-items:center; justify-content:center; border-radius:10px; border:1px solid #233036; background:#0d1f29; color:#b8c4cc; cursor:pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path></svg>
</button>
</sc-if>
<button onClick="{{goHome}}" aria-label="Housebets sports home" style="{{logoStyle}}">
<span style="color:#00f5ff">H</span><span style="margin-left:-4px">ousebets</span>
<sc-if value="{{isDesktop}}" hint-placeholder-val="{{true}}"><svg width="30" height="22" viewBox="0 0 30 22" fill="none" stroke="#00f5ff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M2 15c4-8 9-8 12-2s7 6 9-3c1-4 3-6 5-5"></path><path d="M5 20c3-3 6-3 9 0s6 3 9 0" stroke-opacity="0.45"></path></svg></sc-if>
</button>
<sc-if value="{{isDesktop}}" hint-placeholder-val="{{true}}">
<button class="hb-card hb-lift" onClick="{{goSearch}}" style="flex:1; max-width:440px; margin-left:12px; display:flex; align-items:center; gap:10px; height:42px; padding:0 14px; border-radius:21px; border:1px solid #233036; background:#0d1f29; color:#8a96a4; font-family:Inter, sans-serif; font-size:14px; cursor:pointer; text-align:left">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<span style="flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">Search teams, players, competitions, markets</span>
</button>
</sc-if>
<div style="flex:1"></div>
<div style="display:flex; align-items:center; gap:8px">
<button onClick="{{openMyBets}}" aria-label="Balance {{balanceText}} USDT, open my bets" style="display:flex; align-items:center; gap:8px; height:44px; padding:0 12px 0 10px; border-radius:10px; border:0; background:#13242c; color:#ffffff; font-family:Inter, sans-serif; cursor:pointer">
<svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="16" fill="#26a17b"></circle><path d="M17.9 17.3v0c-.1 0-.7.1-1.9.1-1 0-1.7 0-1.9-.1v0c-3.7-.2-6.5-.8-6.5-1.6s2.8-1.4 6.5-1.6v2.5c.2 0 .9.1 1.9.1 1.2 0 1.8-.1 1.9-.1v-2.5c3.7.2 6.4.8 6.4 1.6s-2.7 1.4-6.4 1.6zm0-3.4v-2.2h5.2V8.3H8.9v3.4h5.2v2.2c-4.2.2-7.4 1-7.4 2s3.2 1.8 7.4 2v7.2h3.8V18c4.2-.2 7.3-1 7.3-2s-3.1-1.8-7.3-2z" fill="#ffffff"></path></svg>
<span style="font-size:15px; font-weight:700; letter-spacing:-0.01em">${{balanceWhole}}<span style="font-size:12px; color:#b8c4cc">.{{balanceCents}}</span></span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8a96a4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg>
</button>
<button onClick="{{depositToast}}" style="height:44px; padding:0 {{walletPad}}; border:0; border-radius:10px; background:#c3f4f1; color:#0b1a21; font-family:Inter, sans-serif; font-size:15px; font-weight:700; cursor:pointer">Wallet</button>
<sc-if value="{{showPrize}}" hint-placeholder-val="{{true}}">
<div style="display:flex; align-items:center; gap:10px; height:44px; padding:0 14px 0 10px; border-radius:10px; background:#13242c">
<svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="hbCup" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a3"></stop><stop offset=".55" stop-color="#f8d466"></stop><stop offset="1" stop-color="#c9952a"></stop></linearGradient></defs><path d="M9 5h14v6a7 7 0 0 1-14 0z" fill="url(#hbCup)"></path><path d="M9 7H5v2a5 5 0 0 0 5 5M23 7h4v2a5 5 0 0 1-5 5" fill="none" stroke="#e0b44a" stroke-width="2"></path><path d="M14 18h4v5h-4z" fill="#d9a63a"></path><path d="M10 24h12v3H10z" rx="1" fill="#8a6418"></path></svg>
<div style="display:flex; flex-direction:column; line-height:1.15; font-family:Inter, sans-serif">
<span style="font-size:11px; color:#8a96a4">Monthly Prize</span>
<span style="font-size:15px; font-weight:700; color:#f8d466">$100,000<span style="font-size:11px">.00</span></span>
</div>
</div>
</sc-if>
<sc-if value="{{isDesktop}}" hint-placeholder-val="{{true}}">
<button class="hb-card hb-lift" onClick="{{openMyBets}}" style="display:flex; align-items:center; gap:8px; height:42px; padding:0 14px; border-radius:10px; border:1px solid #233036; background:#0d1f29; color:#f2fbff; font-family:Inter, sans-serif; font-size:14px; font-weight:700; cursor:pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v4a2 2 0 0 0 0 4v4H3v-4a2 2 0 0 0 0-4z"></path><path d="M10 7v12"></path></svg>
My bets
</button>
</sc-if>
</div>
</header>
<div style="flex:none; position:relative; z-index:2; display:flex; height:40px; background:#051016; border-bottom:1px solid #1a2b33; overflow:hidden">
<button onClick="{{goLive}}" style="position:relative; overflow:hidden; z-index:2; flex:none; display:flex; align-items:center; gap:8px; height:40px; padding:0 22px 0 14px; border:0; background:#df1646; color:#ffffff; font-family:'Big Shoulders Display', Impact, sans-serif; font-size:19px; font-weight:900; letter-spacing:.04em; text-transform:uppercase; cursor:pointer; clip-path:polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%)">
<span style="position:relative; width:8px; height:8px"><span style="position:absolute; inset:0; border-radius:50%; background:#ffffff; animation:hbPing 1.4s ease-out infinite"></span><span style="position:absolute; inset:0; border-radius:50%; background:#ffffff"></span></span>
Live <span style="font-family:'JetBrains Mono', monospace; font-size:13px; font-weight:800">{{cnt.all}}</span>
</button>
<div style="flex:1; min-width:0; overflow:hidden; position:relative">
<sc-if value="{{hasTicker}}" hint-placeholder-val="{{true}}">
<div style="{{tickerStyle}}">
<sc-for list="{{ticker}}" as="k" hint-placeholder-count="8">
<button onClick="{{k.open}}" style="flex:none; display:flex; align-items:center; gap:8px; height:40px; padding:0 16px; border:0; border-right:1px solid #1a2b33; background:transparent; color:#d6e1e8; font-family:'JetBrains Mono', monospace; font-size:12px; font-weight:700; cursor:pointer; white-space:nowrap">
<span style="width:6px; height:6px; border-radius:50%; background:{{k.hc}}"></span>
<span>{{k.h}}</span>
<span style="color:#c3f4f1; background:#0d2a33; padding:2px 6px; border-radius:4px">{{k.score}}</span>
<span>{{k.a}}</span>
<span style="width:6px; height:6px; border-radius:50%; background:{{k.ac}}"></span>
<span style="color:#ff9db0">{{k.clock}}</span>
</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{tickerEmpty}}" hint-placeholder-val="{{false}}">
<span style="display:flex; align-items:center; height:40px; padding:0 16px; font-family:'JetBrains Mono', monospace; font-size:12px; color:#8a96a4; white-space:nowrap">Nothing live · next kick-off {{nextKo}}</span>
</sc-if>
</div>
</div>
<div style="flex:1; display:flex; min-height:0; position:relative">
<sc-if value="{{isDesktop}}" hint-placeholder-val="{{true}}">
<nav aria-label="Sportsbook" style="{{navStyle}}">
<button onClick="{{goHome}}" aria-label="Sports home" class="hb-nav" style="{{nv.home}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>
<sc-if value="{{navOpen}}" hint-placeholder-val="{{true}}"><span style="flex:1">Sports home</span></sc-if>
</button>
<button onClick="{{goLive}}" aria-label="Live" class="hb-nav" style="{{nv.live}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="2"></circle><path d="M16.24 7.76a6 6 0 0 1 0 8.49M7.76 16.24a6 6 0 0 1 0-8.49M19.07 4.93a10 10 0 0 1 0 14.14M4.93 19.07a10 10 0 0 1 0-14.14"></path></svg>
<sc-if value="{{navOpen}}" hint-placeholder-val="{{true}}"><span style="flex:1">Live</span><span style="font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:800; color:#ff9db0; background:#2a1620; border-radius:5px; padding:2px 7px">{{cnt.all}}</span></sc-if>
</button>
<button onClick="{{goFootball}}" aria-label="Football" class="hb-nav" style="{{nv.footballTop}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m12 7.5 4 2.9-1.5 4.6h-5L8 10.4z"></path><path d="M12 3v4.5M21 10.5h-5M17.5 19.5 14.5 15M6.5 19.5 9.5 15M3 10.5h5"></path></svg>
<sc-if value="{{navOpen}}" hint-placeholder-val="{{true}}"><span style="flex:1">Football</span></sc-if>
</button>
<button onClick="{{openSlipNav}}" aria-label="Bet slip and my bets" class="hb-nav" style="{{nv.plain}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v4a2 2 0 0 0 0 4v4H3v-4a2 2 0 0 0 0-4z"></path><path d="M10 7v12"></path></svg>
<sc-if value="{{navOpen}}" hint-placeholder-val="{{true}}"><span style="flex:1">Bet slip &amp; my bets</span><sc-if value="{{slipHasItems}}" hint-placeholder-val="{{false}}"><span style="font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:800; color:#0b1a21; background:#c3f4f1; border-radius:5px; padding:2px 7px">{{slip.count}}</span></sc-if></sc-if>
</button>
<sc-if value="{{navOpen}}" hint-placeholder-val="{{true}}">
<span style="{{navHead}}">Sports</span>
</sc-if>
<button onClick="{{goFootball}}" aria-label="Football" class="hb-nav" style="{{nv.football}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m12 7.5 4 2.9-1.5 4.6h-5L8 10.4z"></path><path d="M12 3v4.5M21 10.5h-5M17.5 19.5 14.5 15M6.5 19.5 9.5 15M3 10.5h5"></path></svg>
<sc-if value="{{navOpen}}" hint-placeholder-val="{{true}}"><span style="flex:1">Football</span><span style="{{nb.football}}">{{cnt.football}}</span></sc-if>
</button>
<button onClick="{{goBasketball}}" aria-label="Basketball" class="hb-nav" style="{{nv.basketball}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3v18M5.6 5.6c3 3 3 9.8 0 12.8M18.4 5.6c-3 3-3 9.8 0 12.8"></path></svg>
<sc-if value="{{navOpen}}" hint-placeholder-val="{{true}}"><span style="flex:1">Basketball</span><span style="{{nb.basketball}}">{{cnt.basketball}}</span></sc-if>
</button>
<button onClick="{{goTennis}}" aria-label="Tennis" class="hb-nav" style="{{nv.tennis}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M5.6 5.6a9 9 0 0 1 0 12.8M18.4 5.6a9 9 0 0 0 0 12.8"></path></svg>
<sc-if value="{{navOpen}}" hint-placeholder-val="{{true}}"><span style="flex:1">Tennis</span><span style="{{nb.tennis}}">{{cnt.tennis}}</span></sc-if>
</button>
<button onClick="{{goHockey}}" aria-label="Ice hockey" class="hb-nav" style="{{nv.icehockey}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3l6 12h8a2 2 0 0 1 0 4H9.5L3 5"></path><ellipse cx="17" cy="9" rx="3" ry="1.5"></ellipse></svg>
<sc-if value="{{navOpen}}" hint-placeholder-val="{{true}}"><span style="flex:1">Ice hockey</span><span style="{{nb.icehockey}}">{{cnt.icehockey}}</span></sc-if>
</button>
<button onClick="{{goEsports}}" aria-label="Esports" class="hb-nav" style="{{nv.esports}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="2" y="7" width="20" height="10" rx="5"></rect><path d="M7 10v4M5 12h4M15 11h.01M18 13h.01"></path></svg>
<sc-if value="{{navOpen}}" hint-placeholder-val="{{true}}"><span style="flex:1">Esports</span><span style="{{nb.esports}}">{{cnt.esports}}</span></sc-if>
</button>
<sc-if value="{{navOpen}}" hint-placeholder-val="{{true}}">
<span style="{{navHead}}">Top competitions</span>
<sc-for list="{{navComps}}" as="c" hint-placeholder-count="6">
<button onClick="{{c.go}}" class="hb-nav" style="{{c.style}}">
<span style="{{c.badge}}">{{c.ini}}</span><span style="flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap">{{c.name}}</span>
</button>
</sc-for>
<span style="{{navHead}}">Following</span>
<sc-for list="{{navFollow}}" as="f" hint-placeholder-count="2">
<button onClick="{{f.go}}" style="display:flex; align-items:center; gap:10px; width:100%; min-height:40px; padding:0 12px; border:0; border-radius:8px; background:transparent; color:#d6e1e8; font-family:Inter, sans-serif; font-size:14px; font-weight:500; cursor:pointer; text-align:left">
<span style="{{f.crest}}">{{f.code}}</span><span style="flex:1">{{f.name}}</span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="#f8d466" stroke="#f8d466" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"></path></svg>
</button>
</sc-for>
<sc-if value="{{noFollow}}" hint-placeholder-val="{{false}}">
<span style="padding:4px 12px 0; font-size:13px; line-height:1.45; color:#8a96a4">Star a team or competition to pin it here.</span>
</sc-if>
</sc-if>
</nav>
</sc-if>
<main id="content" ref="{{mainRef}}" style="flex:1; min-width:0; overflow-y:auto; overflow-x:hidden; background:transparent">
<div style="{{pageWrap}}">
<sc-if value="{{showCrumb}}" hint-placeholder-val="{{false}}">
<div style="display:flex; align-items:center; gap:8px; font-family:Inter, sans-serif; font-size:13px; color:#8a96a4; flex-wrap:wrap">
<button onClick="{{goHome}}" style="border:0; background:transparent; padding:6px 0; color:#8a96a4; font-family:inherit; font-size:13px; cursor:pointer">Sports</button>
<sc-for list="{{crumbs}}" as="c" hint-placeholder-count="2">
<span aria-hidden="true" style="color:#56656f">›</span>
<button onClick="{{c.go}}" class="hb-chip" style="{{c.style}}">{{c.name}}</button>
</sc-for>
</div>
</sc-if>
<sc-if value="{{pHome}}" hint-placeholder-val="{{true}}">
<div style="display:flex; flex-direction:column; gap:{{gapL}}; animation:hbIn .35s ease-out">
<div style="position:relative">
<label for="hb-search" style="position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0)">Search teams, players, competitions, markets</label>
<div class="hb-card" style="display:flex; align-items:center; gap:10px; height:52px; padding:0 16px; border-radius:26px; border:1px solid {{searchBorder}}; background:#0d1f29; color:#8a96a4">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input id="hb-search" ref="{{searchRef}}" value="{{search}}" onChange="{{onSearch}}" placeholder="Search teams, players, competitions, markets" autocomplete="off" style="flex:1; min-width:0; height:48px; border:0; outline:none; background:transparent; color:#f2fbff; font-family:Inter, sans-serif; font-size:16px">
<sc-if value="{{searching}}" hint-placeholder-val="{{false}}">
<button onClick="{{clearSearch}}" aria-label="Clear search" style="width:36px; height:36px; display:flex; align-items:center; justify-content:center; border:0; border-radius:18px; background:#13242c; color:#b8c4cc; cursor:pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg>

<div style="display:flex; flex-direction:column; align-items:center; text-align:center; gap:8px; padding:30px 8px">
<span style="font-size:16px; font-weight:700">No open bets</span>
<span style="font-size:13px; color:#b8c4cc">Bets you place show here until they settle.</span>
</div>
</sc-if>
</sc-if>
<sc-if value="{{mb.isSettled}}" hint-placeholder-val="{{false}}">
<sc-for list="{{mb.settled}}" as="b" hint-placeholder-count="3">
<div class="hb-card" style="position:relative; overflow:hidden; display:flex; flex-direction:column; gap:8px; padding:14px; border-radius:6px; background:#0d1f29; border:1px solid #1c2e37">
<div aria-hidden="true" style="position:absolute; left:0; top:0; bottom:0; width:3px; background:{{b.bar}}"></div>
<div style="display:flex; align-items:center; gap:8px">
<span style="flex:1; font-size:16px; font-weight:700">{{b.label}}</span>
<span style="{{b.badgeStyle}}">{{b.badge}}</span>
</div>
<span style="font-size:12px; color:#b8c4cc">{{b.market}} · {{b.matchName}}</span>
<div style="display:flex; justify-content:space-between; font-family:Inter, sans-serif; font-size:12px; color:#b8c4cc"><span>{{b.stakeText}} @ {{b.oddsText}}</span><span>Returned <b style="color:{{b.retColor}}">{{b.retText}}</b></span></div>
<span style="font-family:Inter, sans-serif; font-size:10px; letter-spacing:.06em; color:#8a96a4">{{b.id}} · {{b.placed}}</span>
</div>
</sc-for>
</sc-if>
</div>
</sc-if>
</div>
</aside>
</div>
<sc-if value="{{isMobile}}" hint-placeholder-val="{{false}}">
<div style="flex:none; position:relative; z-index:3; background:#051016; border-top:1px solid #1a2b33">
<sc-if value="{{showSlipBar}}" hint-placeholder-val="{{false}}">
<div style="padding:8px 10px 0">
<button onClick="{{openSheet}}" style="width:100%; display:flex; align-items:center; gap:10px; min-height:54px; padding:0 14px; border:0; background:{{barBg}}; color:#0b1a21; cursor:pointer; text-align:left; clip-path:polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px)); animation:hbSheet .3s ease-out">
<span style="min-width:28px; height:28px; padding:0 6px; border-radius:14px; background:#0b1a21; color:#c3f4f1; font-family:'JetBrains Mono', monospace; font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center">{{slip.count}}</span>
<span style="flex:1; display:flex; flex-direction:column; line-height:1.1">
<span style="font-family:'Big Shoulders Display', Impact, sans-serif; font-size:21px; font-weight:900; text-transform:uppercase">{{barTitle}}</span>
<span style="font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:700">{{barSub}}</span>
</span>
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="m6 15 6-6 6 6"></path></svg>
</button>
</div>
</sc-if>
<nav aria-label="Primary" style="display:flex">
<button onClick="{{goHome}}" style="{{bn.home}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Home
</button>
<button onClick="{{goLive}}" style="{{bn.live}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="2"></circle><path d="M16.24 7.76a6 6 0 0 1 0 8.49M7.76 16.24a6 6 0 0 1 0-8.49M19.07 4.93a10 10 0 0 1 0 14.14M4.93 19.07a10 10 0 0 1 0-14.14"></path></svg>Live {{cnt.all}}
</button>
<button onClick="{{goFootball}}" style="{{bn.football}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="m12 7.5 4 2.9-1.5 4.6h-5L8 10.4z"></path><path d="M12 3v4.5M21 10.5h-5M17.5 19.5 14.5 15M6.5 19.5 9.5 15M3 10.5h5"></path></svg>Football
</button>
<button onClick="{{openMyBets}}" style="{{bn.bets}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18v4a2 2 0 0 0 0 4v4H3v-4a2 2 0 0 0 0-4z"></path><path d="M10 7v12"></path></svg>My bets
</button>
<button onClick="{{goSearch}}" style="{{bn.search}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Search
</button>
</nav>
</div>
</sc-if>
<sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
<div role="status" style="{{toastStyle}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c3f4f1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>
<span>{{toast}}</span>
</div>
</sc-if>
</div>
